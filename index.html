<DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senha com Medidor de Força</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.5rem;
            color: #38bdf8;
        }

        .result-container {
            background-color: #0f172a;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }

        #password-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            font-weight: bold;
            word-break: break-all;
            user-select: all;
        }

        .btn-copy {
            background-color: #38bdf8;
            border: none;
            color: #0f172a;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-copy:hover {
            background-color: #7dd3fc;
        }

        /* Medidor de Força */
        .strength-container {
            margin-bottom: 20px;
        }

        .strength-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #94a3b8;
        }

        #strength-label {
            font-weight: bold;
        }

        .strength-bar-bg {
            background-color: #334155;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        #strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.4s ease, background-color 0.4s ease;
        }

        /* Configurações */
        .setting {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .setting input[type="number"] {
            width: 60px;
            padding: 5px;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 4px;
            text-align: center;
        }

        .setting input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn-generate {
            width: 100%;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-generate:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Gerador de Senha</h2>
    
    <div class="result-container">
        <span id="password-display">Clique em Gerar</span>
        <button class="btn-copy" id="copy-btn">Copiar</button>
    </div>

    <div class="strength-container">
        <div class="strength-text">
            <span>Força da Senha:</span>
            <span id="strength-label">Inexistente</span>
        </div>
        <div class="strength-bar-bg">
            <div id="strength-bar"></div>
        </div>
    </div>

    <div class="settings">
        <div class="setting">
            <label>Comprimento da senha</label>
            <input type="number" id="length" min="4" max="32" value="12">
        </div>
        <div class="setting">
            <label>Incluir Letras Maiúsculas</label>
            <input type="checkbox" id="uppercase" checked>
        </div>
        <div class="setting">
            <label>Incluir Letras Minúsculas</label>
            <input type="checkbox" id="lowercase" checked>
        </div>
        <div class="setting">
            <label>Incluir Números</label>
            <input type="checkbox" id="numbers" checked>
        </div>
        <div class="setting">
            <label>Incluir Símbolos</label>
            <input type="checkbox" id="symbols" checked>
        </div>
    </div>

    <button class="btn-generate" id="generate-btn">Gerar Senha</button>
</div>

<script>
    const displayEl = document.getElementById('password-display');
    const copyBtn = document.getElementById('copy-btn');
    const lengthEl = document.getElementById('length');
    const uppercaseEl = document.getElementById('uppercase');
    const lowercaseEl = document.getElementById('lowercase');
    const numbersEl = document.getElementById('numbers');
    const symbolsEl = document.getElementById('symbols');
    const generateBtn = document.getElementById('generate-btn');
    const strengthBar = document.getElementById('strength-bar');
    const strengthLabel = document.getElementById('strength-label');

    const chars = {
        uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
        lowercase: 'abcdefghijklmnopqrstuvwxyz',
        numbers: '0123456789',
        symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
    };

    // Função para gerar a senha
    function generatePassword() {
        let length = parseInt(lengthEl.value);
        if (length < 4) length = 4;
        if (length > 32) length = 32;
        lengthEl.value = length;

        let allowedChars = '';
        let typesCount = 0;

        if (uppercaseEl.checked) { allowedChars += chars.uppercase; typesCount++; }
        if (lowercaseEl.checked) { allowedChars += chars.lowercase; typesCount++; }
        if (numbersEl.checked) { allowedChars += chars.numbers; typesCount++; }
        if (symbolsEl.checked) { allowedChars += chars.symbols; typesCount++; }

        if (allowedChars === '') {
            displayEl.innerText = 'Selecione uma opção!';
            updateStrengthBar(0, 0);
            return;
        }

        let password = '';
        for (let i = 0; i < length; i++) {
            const randomIndex = Math.floor(Math.random() * allowedChars.length);
            password += allowedChars[randomIndex];
        }

        displayEl.innerText = password;
        evaluateStrength(password, length, typesCount);
    }

    // Função para avaliar a força da senha
    function evaluateStrength(password, length, typesCount) {
        let score = 0;

        // Regra 1: Comprimento da senha
        if (length >= 8) score += 1;
        if (length >= 12) score += 1;
        if (length >= 16) score += 1;

        // Regra 2: Diversidade de caracteres
        if (typesCount >= 3) score += 1;
        if (typesCount === 4) score += 1;

        updateStrengthBar(score);
    }

    // Atualiza o visual do medidor de força
    function updateStrengthBar(score) {
        let width = '0%';
        let color = '#ef4444';
        let label = 'Muito Fraca';

        switch (score) {
            case 1:
                width = '25%';
                color = '#ef4444'; // Vermelho
                label = 'Fraca';
                break;
            case 2:
                width = '50%';
                color = '#f59e0b'; // Amarelo/Laranja
                label = 'Média';
                break;
            case 3:
                width = '75%';
                color = '#3b82f6'; // Azul
                label = 'Forte';
                break;
            case 4:
            case 5:
                width = '100%';
                color = '#10b981'; // Verde
                label = 'Muito Forte';
                break;
            default:
                width = '0%';
                color = '#334155';
                label = 'Inexistente';
        }

        strengthBar.style.width = width;
        strengthBar.style.backgroundColor = color;
        strengthLabel.innerText = label;
        strengthLabel.style.color = color;
    }

    // Copiar para a área de transferência
    copyBtn.addEventListener('click', () => {
        const password = displayEl.innerText;
        if (password === 'Clique em Gerar' || password === 'Selecione uma opção!') return;
        
        navigator.clipboard.writeText(password).then(() => {
            const originalText = copyBtn.innerText;
            copyBtn.innerText = 'Copiado!';
            copyBtn.style.backgroundColor = '#10b981';
            copyBtn.style.color = '#fff';
            
            setTimeout(() => {
                copyBtn.innerText = originalText;
                copyBtn.style.backgroundColor = '#38bdf8';
                copyBtn.style.color = '#0f172a';
            }, 1500);
        });
    });

    generateBtn.addEventListener('click', generatePassword);
</script>

</body>
</html>
